<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>국어 교실 | 선생님·학생이 함께 쓰는 국어 수업 사이트</title>
<meta name="description" content="맞춤법·어휘·작품 감상·국어 게임·글쓰기와 기말고사 시험 범위, 선생님용 학생 활동 통계까지 담은 국어 수업 사이트.">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#2f4f8f">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: ink-and-paper reading room. Role gate → sticky bar → tab rail → content. Light-first with an "밤 독서" dark theme. */
:root{
  --bg:#f4f5f2; --paper:#ffffff; --paper2:#eaece7; --line:#d5d9d2; --ink:#1b1f24; --muted:#636b74;
  --indigo:#2f4f8f; --celadon:#3f8f7a; --persimmon:#d9622b; --gold:#b58a2a;
  --good:#2f8f5b; --bad:#c9353d; --warn:#c47400;
  --display:"Nanum Myeongjo","Noto Serif KR",serif; --body:"Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15181d;--paper:#1d2127;--paper2:#262b33;--line:#363c46;--ink:#eceff3;--muted:#9aa3ad;--indigo:#7e9ee0;--celadon:#5fc2a8;--persimmon:#f08a5a;--gold:#d8ad4e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181d;--paper:#1d2127;--paper2:#262b33;--line:#363c46;--ink:#eceff3;--muted:#9aa3ad;--indigo:#7e9ee0;--celadon:#5fc2a8;--persimmon:#f08a5a;--gold:#d8ad4e;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 14px}
button:hover{border-color:var(--indigo)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
button.pri{background:var(--indigo);border-color:var(--indigo);color:#fff;font-weight:700}
button.sm{padding:5px 10px;font-size:13px;border-radius:8px}
button.act{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=text],input[type=password],input[type=number],select,textarea{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 12px}
textarea{width:100%;min-height:120px;resize:vertical;line-height:1.7}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.3;text-wrap:balance}
h2{font-size:22px}h3{font-size:17px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.num{font-variant-numeric:tabular-nums}
.gate{min-height:100%;display:grid;place-items:center;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gate .box{width:min(760px,100%);text-align:center}
.gate h1{font-size:clamp(34px,6vw,56px);font-weight:800;letter-spacing:-.01em}
.gate h1 span{color:var(--indigo)}
.gate p.sub{color:var(--muted);margin:8px 0 28px}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.role{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:28px 22px;text-align:left;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:transform .15s,border-color .15s}
.role:hover{transform:translateY(-3px);border-color:var(--indigo)}
.role .big{font-size:40px}.role h3{font-size:22px}.role p{margin:0;color:var(--muted);font-size:14px}
.role form{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:36px;height:36px;border-radius:10px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px}
.brand h1{font-size:18px}.brand small{display:block;font-size:11px;color:var(--muted);font-family:var(--body)}
.who{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:var(--paper2);font-size:13px;font-weight:700}
.chip.t{background:color-mix(in srgb,var(--persimmon) 18%,var(--paper2));color:var(--persimmon)}
.chip.s{background:color-mix(in srgb,var(--celadon) 18%,var(--paper2));color:var(--celadon)}
.wrap{padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;max-width:1180px;margin:0 auto}
.tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:4px}
.tabs button{border:none;background:transparent;padding:8px 13px;font-weight:700;border-radius:10px;color:var(--muted)}
.tabs button.on{background:var(--ink);color:var(--bg)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px}
.card.soft{background:var(--paper2);border-color:transparent}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.row.between{justify-content:space-between}
.stat{display:flex;flex-direction:column;gap:2px;padding:10px 14px;border-radius:12px;background:var(--paper2);min-width:0}
.stat b{font-family:var(--display);font-size:24px}.stat span{font-size:12px;color:var(--muted)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--paper2)}
.pill.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.bar{height:9px;border-radius:999px;background:var(--paper2);overflow:hidden}.bar i{display:block;height:100%;background:var(--indigo);border-radius:999px;transition:width .3s}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.opts button{text-align:left;padding:12px 14px;border-radius:12px;background:var(--paper2);border-color:transparent}
.opts button.ok{background:color-mix(in srgb,var(--good) 22%,var(--paper2));border-color:var(--good)}
.opts button.no{background:color-mix(in srgb,var(--bad) 22%,var(--paper2));border-color:var(--bad)}
.opts button:disabled{cursor:default}
.q{font-size:19px;font-weight:700;margin:6px 0 12px;font-family:var(--display)}
.poem{font-family:var(--display);font-size:17px;line-height:1.9;white-space:pre-wrap;padding:16px 20px;border-left:3px solid var(--indigo);background:var(--paper2);border-radius:0 12px 12px 0}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--muted);font-weight:700}
.tright{text-align:right}
.scroll{overflow-x:auto}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.menu button{text-align:left;padding:18px 16px;border-radius:16px;display:flex;flex-direction:column;gap:6px;background:var(--paper);min-height:120px}
.menu button .ic{font-size:28px}.menu button b{font-family:var(--display);font-size:17px}.menu button span{font-size:13px;color:var(--muted)}
.menu button.locked{opacity:.55;cursor:not-allowed}
.flash{perspective:1000px;cursor:pointer}
.flash .in{position:relative;min-height:170px;border-radius:16px;transition:transform .5s;transform-style:preserve-3d}
.flash.f .in{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;display:grid;place-items:center;padding:20px;text-align:center;border-radius:16px;background:var(--paper2);font-family:var(--display);font-size:22px}
.flash .back{transform:rotateY(180deg);background:color-mix(in srgb,var(--indigo) 15%,var(--paper2));font-size:16px;font-family:var(--body)}
.manuscript{display:grid;grid-template-columns:repeat(20,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;font-family:var(--display)}
.manuscript div{aspect-ratio:1;background:var(--paper);display:grid;place-items:center;font-size:clamp(9px,1.6vw,15px)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.toast.show{opacity:1}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:25;display:grid;place-items:center;padding:16px}
.overlay .box{width:min(640px,100%);background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;max-height:90vh;overflow:auto}
.notice{border-left:4px solid var(--persimmon);padding:10px 14px;background:var(--paper2);border-radius:0 10px 10px 0}
.range li{margin:4px 0}
.rank{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--paper2)}
.rank b.n{font-family:var(--display);font-size:20px;width:30px;text-align:center}
.hl{background:color-mix(in srgb,var(--gold) 30%,transparent);border-radius:3px;padding:0 2px}
.wordbtn{display:inline-block;margin:3px;padding:6px 12px;border-radius:999px;background:var(--paper2);cursor:pointer;border:1px solid transparent}
.wordbtn.sel{border-color:var(--indigo);background:color-mix(in srgb,var(--indigo) 18%,var(--paper2))}
.footer{text-align:center;color:var(--muted);font-size:13px;padding:20px}
@media (max-width:700px){.manuscript{grid-template-columns:repeat(10,1fr)}}
.poem .ln{display:flex;gap:10px;padding:2px 6px;border-radius:6px;cursor:pointer;align-items:flex-start;flex-wrap:wrap}
.poem .ln:hover{background:color-mix(in srgb,var(--indigo) 8%,transparent)}
.poem .lno{font-family:var(--body);font-size:11px;color:var(--muted);min-width:22px;padding-top:7px;text-align:right}
.poem .lt{flex:1;min-width:0}
.poem .ln.mk .lt,li.mk{background:color-mix(in srgb,var(--gold) 28%,transparent);text-decoration:underline;text-decoration-color:var(--persimmon);text-decoration-thickness:2px;text-underline-offset:4px;border-radius:4px}
.memo{width:100%;font-family:var(--body);font-size:13px;color:var(--muted);padding:2px 0 4px 32px;display:flex;gap:8px;align-items:center}
.gw{border-bottom:2px dotted var(--indigo);cursor:help}
.gpop{position:absolute;z-index:40;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;max-width:260px;font-size:13px;line-height:1.5;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.selrow td{background:color-mix(in srgb,var(--indigo) 10%,transparent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ================= AUTH ================= */
const TEACHER_ID_HASH='66242cccd212b431a3e0e5ffe3afffc6e44b17b2dcd9169811f273ae23a5bf2c';
const TEACHER_PW_HASH='563dfdc0386754287cf3204eef9dc8284f7711937eff131b58d25f5f833d594d';
async function sha(s){const b=new TextEncoder().encode(s);if(!crypto.subtle)return null;const h=await crypto.subtle.digest('SHA-256',b);return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}

/* ================= UTIL / STORE ================= */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const rnd=n=>Math.floor(Math.random()*n),shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k,d){try{const v=localStorage.getItem('kr.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('kr.'+k,JSON.stringify(v))}catch(e){}}};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1900)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>new Date(t).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
let S={role:null,student:null,grade:'m1',tab:'home',sub:null};
Object.assign(S,store.get('session',{}));
const GRADES=[['m1','중1'],['m2','중2'],['m3','중3'],['h1','고1'],['h2','고2'],['h3','고3']];
const gname=id=>(GRADES.find(g=>g[0]===id)||GRADES[0])[1];
function logAct(type,detail,score){const st=S.student;if(!st)return;const L=store.get('log',[]);L.push({s:st.name,n:st.no,g:S.grade,t:Date.now(),type,detail,score:score==null?null:score});store.set('log',L.slice(-2000));
 const students=store.get('students',{});const k=st.no+'|'+st.name;students[k]=students[k]||{name:st.name,no:st.no,g:S.grade,first:Date.now()};students[k].last=Date.now();students[k].g=S.grade;store.set('students',students)}

{t:'운수 좋은 날',a:'현진건',y:1924,kind:'guide',g:['m2','m3','h1'],genre:'현대 소설(단편)',

{t:'동백꽃',a:'김유정',y:1936,kind:'guide',g:['m1','m2','m3'],genre:'현대 소설(단편)',
 sum:'소작인의 아들인 "나"는 마름의 딸 점순이가 건넨 감자를 자존심 때문에 거절한다. 그 뒤 점순이는 자기네 수탉으로 "나"의 닭을 괴롭히며 약을 올린다. 화가 난 "나"가 점순네 닭을 때려죽이자, 점순이는 일러바치지 않겠다며 "나"를 끌어안고 둘은 노란 동백꽃(생강나무꽃) 속으로 쓰러진다.',
 pts:['시점: 1인칭 주인공 시점 — 눈치 없는 "나"의 서술이 해학을 낳음.','구성: 역순행적 — 현재(닭싸움)에서 과거(감자 사건)로 돌아갔다가 현재로.','갈등: 점순이의 애정 표현을 모르는 "나"와 점순이의 갈등, 소작인과 마름이라는 신분 배경.','핵심 소재: 감자(애정의 표시), 닭싸움(점순이의 관심 끌기), 동백꽃(사춘기의 풋사랑·화해).','주제: 사춘기 소년·소녀의 순박한 사랑, 농촌 사회의 향토성과 해학.'],
 gl:{'마름':'지주 대신 소작지를 관리하는 사람','소작인':'남의 땅을 빌려 농사짓는 사람','동백꽃':'강원도에서 생강나무꽃을 부르는 말(노란색)'},
 qs:[[null,'"나"가 감자를 거절한 이유와 점순이가 화난 이유는?','자존심(동정받기 싫음) / 호의를 거절당한 서운함.'],[null,'이 소설이 역순행적 구성인 이유를 사건 순서로 설명하세요.','닭싸움 장면(현재) → 감자 사건(과거 회상) → 닭 죽임과 화해(현재).'],[null,'해학이 생기는 핵심 이유는?','독자는 아는 점순이의 마음을 서술자 "나"만 모름.']]},
{t:'사랑손님과 어머니',a:'주요섭',y:1935,kind:'guide',g:['m1','m2'],genre:'현대 소설(단편)',
 sum:'여섯 살 옥희의 눈으로 본 이야기. 아버지 친구인 사랑손님 아저씨가 집에 머물게 되고, 젊은 과부인 어머니와 아저씨 사이에 조심스러운 감정이 오간다. 옥희가 전한 삶은 달걀과 꽃, 어머니의 풍금 연주 등이 두 사람의 마음을 암시하지만, 어머니는 과부의 재혼을 꺼리는 당시 사회 분위기 때문에 마음을 접고 아저씨는 떠난다.',

{t:'봄은',a:'신동엽',y:1968,kind:'guide',g:['h1','h2','h3'],genre:'현대시',

{t:'꽃',a:'김춘수',y:1952,kind:'guide',g:['m3','h1','h2'],genre:'현대시',

 qs:[[null,'"이름을 불러 준다"는 행위의 의미는?','대상을 인식하고 관계를 맺어 의미를 부여함.'],[null,'1연→2연→3연→4연으로 가며 소망이 어떻게 확장되나요?','나의 인식 → 타자의 나에 대한 인식 → 서로가 서로에게 의미.'],[null,'이 시를 바탕으로 "참된 관계"란 무엇인지 써 보세요.','서로의 본질을 알아보고 이름 불러 주는 관계.']]},
{t:'메밀꽃 필 무렵',a:'이효석',y:1936,kind:'guide',g:['m3','h1','h2'],genre:'현대 소설(단편)',

 gl:{'장돌뱅이':'장을 떠돌며 물건을 파는 상인','파하다':'끝나다','나귀':'당나귀'},

h1:[
 {sem:1,title:'1. 문학의 갈래와 수용',subs:[['서정 갈래의 이해',['화자·시적 상황·정서·태도의 분석 틀.','표현상 특징 선지 읽기(설의·도치·영탄·점층).','「님의 침묵」 역설과 시상 전개.']],['서사 갈래의 이해',['서술자와 시점, 서술 방식(요약·장면), 구성(순행·역순행·액자).','인물의 심리와 갈등 양상.','사회·문화적 맥락에서 작품 해석.']]]},
 {sem:1,title:'2. 독서의 방법',subs:[['사실적·추론적 읽기',['사실적: 글에 드러난 정보 정확히 파악.','추론적: 생략된 내용과 글쓴이의 의도 추리.','근거 문장을 짚어 가며 읽는 습관.']],['비판적·창의적 읽기',['주장의 타당성·근거의 신뢰성 평가.','다른 관점과 비교하고 나의 생각 만들기.','독서 토론과 서평 쓰기.']]]},
 {sem:1,title:'3. 화법의 원리',subs:[['대화와 공감',['공감적 듣기, 자아 노출, 협력의 원리(양·질·관련성·태도).','공손성의 원리: 요령·관용·찬동·겸양·동의.','갈등 상황의 "나 전달법".']],['발표와 면접',['발표: 청중 분석, 매체 활용, 질의응답.','면접: 질문 의도 파악, 간결한 답, 비언어 표현.','모의 면접 실습.']]]},
 {sem:1,title:'4. 작문의 원리',subs:[['정보 전달 글쓰기',['자료 수집(신뢰성)과 조직(시간·공간·논리).','보고서: 목적-방법-결과-결론.','인용과 출처 표기.']],['설득하는 글쓰기',['논증 구조 설계, 예상 반론 반영.','통계·사례·전문가 의견 활용.','독자 설득을 위한 어조와 표현.']]]},
 {sem:2,title:'5. 국어의 규범',subs:[['한글 맞춤법과 표준어',['맞춤법 총칙, 사이시옷 규정, 준말 표기.','표준어 규정: 복수 표준어, 추가 표준어(짜장면·먹거리).','자주 틀리는 표현 100선 점검.']],['표준 발음과 외래어 표기',['표준 발음법: 겹받침, 된소리, ㄴ 첨가.','외래어 표기법 원칙(1음운 1기호, 받침 7개).','로마자 표기법(된소리 안 씀, 음운 변화 반영).']]]},
 {sem:2,title:'6. 고전 문학의 전통',subs:[['고전 시가의 흐름',['고대 가요 → 향가 → 고려 가요·경기체가 → 시조·가사 → 민요·잡가.','「청산별곡」·「관동별곡」·시조 작품 감상.','고전 시가의 정서와 미의식(한·흥·멋).']],['고전 산문',['설화·가전·고전 소설·판소리·민속극.','「춘향전」 판소리계 소설의 특징(적층성·운문체·해학).','한문 문학과 국문 문학.']]]},
 {sem:2,title:'7. 현대 문학의 흐름',subs:[['현대시의 흐름',['1920년대(낭만·민족), 1930년대(모더니즘·순수), 일제 말(저항: 이육사·윤동주), 광복 후(분단·현실 참여: 신동엽 「봄은」).','시대 배경과 작품 주제 연결.','시인별 대표작 정리.']],['현대 소설의 흐름',['1920년대 사실주의(현진건), 1930년대 농촌·풍자(김유정·채만식), 분단 문학, 산업화 시대 소설.','서술 방식의 변화.','작품과 시대 읽기.']]]},
 {sem:2,title:'8. 매체와 소통',subs:[['매체 언어의 특성',['복합 양식성, 상호 작용성, 즉시성.','매체 자료의 생산자와 수용자 관계.','매체 변화에 따른 소통 방식 변화.']],['매체 윤리',['저작권·초상권·개인 정보 보호.','허위 정보와 혐오 표현 경계.','책임 있는 매체 생산 실습.']]]}
],
h2:[
 {sem:1,title:'문학 1. 문학의 본질과 기능',subs:[['문학의 본질',['언어 예술, 형상화, 개연성.','인식적·윤리적·미적 기능.','문학의 소통 구조: 작가-작품-독자.']],['문학 감상의 관점',['내재적(작품 자체), 외재적(표현론·반영론·효용론).','한 작품을 여러 관점으로 해석하기.','비평문 쓰기.']]]},
 {sem:1,title:'문학 2. 한국 문학의 전통',subs:[['고전 시가 심화',['향가·고려 가요·시조·가사 형식과 대표작.','「정과정」·「사미인곡」·「어부사시사」.','정서의 전통: 한, 풍류, 자연 친화.']],['고전 소설 심화',['「홍길동전」·「춘향전」·「구운몽」·「박씨전」.','영웅 소설·애정 소설·군담 소설·몽자류.','판소리계 소설의 적층 문학적 성격.']]]},
 {sem:1,title:'문학 3. 현대 소설과 극',subs:[['1930년대 소설',['김유정(해학), 채만식(풍자 「태평천하」), 이상(「날개」 모더니즘), 이태준.','식민지 현실과 지식인의 고뇌.','서술 기법 분석.']],['희곡과 시나리오',['희곡의 구성(막·장), 시나리오 용어(S#, F.I., O.L.).','극적 갈등과 대사의 기능.','「오발탄」·「원고지」 등 대표작.']]]},
 {sem:2,title:'문학 4. 문학과 사회·역사',subs:[['분단 문학',['6·25와 분단을 다룬 소설(「광장」·「장마」).','이념 대립과 인간성.','통일 지향 문학(「봄은」).']],['산업화 시대 문학',['도시화·노동 문제(「난장이가 쏘아올린 작은 공」).','민중시와 참여 문학.','1980년대 이후 다양화.']]]},
 {sem:1,title:'언어와 매체 1. 언어의 본질',subs:[['언어의 특성',['자의성·사회성·역사성·창조성·분절성·추상성.','언어와 사고, 언어와 문화.','국어의 특질(교착어, 높임법, 어순).']],['국어의 음운·단어',['음운 변동 종합(교체·탈락·첨가·축약).','형태소(자립/의존, 실질/형식), 단어 형성(합성·파생).','품사 통용과 단어의 의미 관계.']]]},
 {sem:2,title:'언어와 매체 2. 문장과 담화',subs:[['문장의 구조',['문장 성분, 겹문장(안은·이어진), 문법 요소(높임·시간·피동·사동·부정).','문장의 중의성과 호응.','올바른 문장 고쳐 쓰기.']],['담화의 특성',['담화의 구성 요소: 화자·청자·맥락·발화.','지시·대용·접속 표현, 생략.','상황 맥락과 사회·문화적 맥락.']]]},
 {sem:2,title:'언어와 매체 3. 국어의 역사',subs:[['중세 국어',['훈민정음 문자 체계(ㆍ ㅿ ㆁ ㆆ, 방점, 어두 자음군).','문법: 주격 조사 이/ㅣ/Ø, 객체 높임 -ᄉᆞᆸ-, 의문형 -가/-고.','「세종어제훈민정음」·「용비어천가」 해석.']],['근대·현대 국어',['근대: ㆍ 소실, 모음 조화 약화, 구개음화, 주격 조사 "가" 등장.','개화기 국한문 혼용 → 현대 한글 전용.','국어 순화와 언어 규범.']]]},
 {sem:2,title:'언어와 매체 4. 매체 언어',subs:[['매체의 유형과 특성',['인쇄·방송·디지털 매체의 소통 방식.','뉴 미디어의 상호 작용성과 참여 문화.','매체 언어의 복합 양식.']],['매체 자료의 생산과 윤리',['목적·대상에 맞는 매체 자료 제작.','저작권·초상권·명예 훼손.','비판적 수용과 책임 있는 공유.']]]}
],
h3:[
 {sem:1,title:'문학 수능 1. 현대시',subs:[['화자와 시적 상황',['화자의 처지·정서·태도를 선지 용어로(관조·성찰·달관·체념·의지).','시상 전개: 시간·공간·대조·점층·수미상관.','표현법 선지: 설의·영탄·도치·반복·대구·역설·반어·감각의 전이.']],['주제별 묶음',['일제 강점기 저항(이육사·윤동주), 자연과 삶(정지용·백석), 분단과 현실(신동엽·김수영), 존재 성찰(김춘수).','작품 간 공통점·차이점 비교 문제.','보기 제시형 문제 접근법.']]]},
 {sem:1,title:'문학 수능 2. 고전 시가',subs:[['향가·고려 가요·시조',['「제망매가」·「청산별곡」·「동짓달 기나긴 밤」.','고어 읽기: ㆍ·ㅿ 처리, 조사 변화.','후렴구의 기능.']],['가사·민요',['「상춘곡」·「관동별곡」·「누항사」, 규방 가사.','4음보 연속체, 서사-본사-결사.','화자의 태도: 안빈낙도·연군·유배.']]]},
 {sem:1,title:'문학 수능 3. 현대 소설',subs:[['서술상 특징',['시점과 서술자의 개입, 요약과 장면 제시, 역순행·삽화식 구성.','문체: 간결체·만연체, 방언, 의식의 흐름.','서술상 특징 선지 판별 훈련.']],['인물과 갈등',['인물 유형(평면·입체, 전형·개성), 심리 변화.','갈등의 전개와 해소, 상징물의 기능.','시대 배경과 주제 연결.']]]},
 {sem:2,title:'문학 수능 4. 고전 소설·극·수필',subs:[['고전 소설',['영웅 소설 구조, 애정 소설, 판소리계 소설, 몽유록·몽자류.','전기성(비현실), 우연성, 권선징악.','인물 관계와 사건 전개 파악.']],['극과 수필',['희곡·시나리오 지시문과 대사의 기능.','수필의 체험-깨달음 구조, 교술 갈래.','「동명왕편」·「규중칠우쟁론기」 등 고전 수필.']]]},
 {sem:2,title:'독서 수능 1. 인문·사회',subs:[['인문 지문',['철학·역사·논리 지문의 개념 정의와 관계 파악.','대립 견해 구조(A vs B) 정리.','보기 적용: 사례에 개념 대입.']],['사회 지문',['경제(수요·공급·환율·금리), 법(권리·의무·판례), 정치 제도.','그래프·표 해석과 수치 추론.','원인-결과, 조건-결과 관계 추적.']]]},
 {sem:2,title:'독서 수능 2. 과학·기술·예술',subs:[['과학·기술 지문',['원리·과정·구조 설명 지문의 흐름도 그리기.','전문 용어의 정의 문장 밑줄.','변수 변화에 따른 결과 추론.']],['예술·융합 지문',['예술 사조·이론의 핵심 개념.','두 영역을 엮은 융합 지문 구조화.','지문 간 비교 문제 접근.']]]},
 {sem:1,title:'화법과 작문',subs:[['화법',['대화·토론·협상·발표·면접의 원리와 전략.','말하기 과정 분석 문제(계획-내용 생성-조직-표현).','담화 상황과 참여자 역할.']],['작문',['글쓰기 과정: 계획-내용 생성-조직-표현-고쳐쓰기.','글의 종류별 특성(설명·설득·친교·정서).','초고와 수정본 비교, 조건에 맞게 쓰기.']]]},
 {sem:2,title:'언어와 매체 수능 종합',subs:[['문법 종합',['음운 변동 유형 판별, 형태소 분석, 단어 형성, 문장 성분·겹문장, 문법 요소.','중세 국어 자료 해석.','세트 문항(지문+문제) 접근.']],['매체',['매체 자료 분석: 생산자 의도, 복합 양식 활용, 수용자 반응.','매체 언어의 특성과 표현 전략.','매체 자료 수정·보완 문제.']]]}
]
};

/* ================= ROLE GATE ================= */
function renderGate(){$('#app').innerHTML=`<div class="gate"><div class="box"><div class="eyebrow">읽고 · 쓰고 · 말하는 교실</div><h1>국어 <span>교실</span></h1><p class="sub">선생님과 학생이 함께 쓰는 국어 수업 사이트. 누구로 들어갈까요?</p>
 <div class="roles">
  <div class="role" id="rStudent"><div class="big">🎒</div><h3>학생으로 입장</h3><p>이름과 번호만 적으면 바로 시작해요. 퀴즈·게임·글쓰기 기록이 선생님께 전달됩니다.</p><form id="fStudent"><div class="row"><input type="text" id="sName" placeholder="이름" required style="flex:1;min-width:100px"><input type="number" id="sNo" placeholder="번호" min="1" max="99" required style="width:90px"></div><select id="sGrade">${GRADES.map(g=>`<option value="${g[0]}">${g[1]}</option>`).join('')}</select><button class="pri" type="submit">입장하기 →</button></form></div>
  <div class="role" id="rTeacher"><div class="big">👩‍🏫</div><h3>선생님으로 입장</h3><p>아이디와 비밀번호가 필요해요. 학생 활동 통계, 시험 범위 편집, 공지, 과제를 관리합니다.</p><form id="fTeacher"><input type="text" id="tId" placeholder="아이디" autocomplete="username"><input type="password" id="tPw" placeholder="비밀번호" autocomplete="current-password"><button class="pri" type="submit">로그인 →</button><div id="tErr" style="font-size:13px;color:var(--bad);min-height:18px"></div></form></div>
 </div><p style="font-size:12px;color:var(--muted);margin-top:24px">최근 학생: ${Object.values(store.get('students',{})).slice(-5).map(s=>esc(s.name)).join(', ')||'아직 없음'}</p></div></div>`;
 const last=store.get('lastStudent');if(last){$('#sName').value=last.name;$('#sNo').value=last.no;$('#sGrade').value=last.g}
 $('#fStudent').onsubmit=e=>{e.preventDefault();const name=$('#sName').value.trim(),no=+$('#sNo').value;if(!name||!no){toast('이름과 번호를 입력하세요');return}S={role:'student',student:{name,no},grade:$('#sGrade').value,tab:'home'};store.set('lastStudent',{name,no,g:S.grade});save();logAct('입장','학생 입장');render()};
 $('#fTeacher').onsubmit=async e=>{e.preventDefault();const id=$('#tId').value.trim(),pw=$('#tPw').value;const hi=await sha(id),hp=await sha(pw);if(hi===null){$('#tErr').textContent='이 브라우저에서는 로그인 기능을 쓸 수 없습니다(https 필요).';return}

function tPick(el){if(!requireTeacher())return;let picked=store.get('pkHist',[]);let tm=0,iv=null;
 el.innerHTML=`<div class="grid2"><div class="card"><h3>🎲 발표자 뽑기</h3><div class="row" style="margin:8px 0"><label style="font-size:13px">학생 수 <input type="number" id="pkN" value="${store.get('pkN',25)}" min="2" max="60" style="width:70px"></label><label style="font-size:13px"><input type="checkbox" id="pkNo" checked> 뽑힌 번호 제외</label><button class="pri" id="pkGo">뽑기!</button><button class="sm" id="pkR">초기화</button></div><div id="pkOut" style="text-align:center;font-family:var(--display);font-size:72px;min-height:90px">?</div><div id="pkH" style="font-size:13px;color:var(--muted);text-align:center"></div></div>
 <div class="card"><h3>⏱️ 활동 타이머</h3><div style="text-align:center;font-family:var(--display);font-size:64px;margin:10px 0" id="tmOut">00:00</div><div class="row" style="justify-content:center">${[1,3,5,10].map(m=>`<button class="sm" data-tm="${m}">${m}분</button>`).join('')}<button class="pri" id="tmGo">시작</button><button class="sm" id="tmStop">정지</button></div><h3 style="margin-top:16px">🗣️ 수업 흐름 추천 (45분)</h3><ol style="font-size:13px;padding-left:18px"><li>시험 범위 체크 & 공지 (3분)</li><li>작품 감상 노트 — 함께 읽고 Q1 쓰기 (12분)</li><li>국어 게임 모둠 대결 (10분)</li><li>글쓰기 연습 + 맞춤법 점검 (15분)</li><li>통계 화면으로 오늘 활동 공유 (5분)</li></ol></div></div>`;
 const dh=()=>$('#pkH').textContent=picked.length?'뽑힌 번호: '+picked.join(', '):'';dh();$('#pkN').onchange=e=>store.set('pkN',+e.target.value);
 $('#pkGo').onclick=()=>{const n=+$('#pkN').value;const pool=[...Array(n)].map((_,i)=>i+1).filter(x=>!$('#pkNo').checked||!picked.includes(x));if(!pool.length){toast('모두 뽑혔어요');return}let k=0;const r=setInterval(()=>{$('#pkOut').textContent=1+rnd(n);if(++k>15){clearInterval(r);const v=pool[rnd(pool.length)];$('#pkOut').textContent=v+'번';picked.push(v);store.set('pkHist',picked);dh()}},60)};
 $('#pkR').onclick=()=>{picked=[];store.set('pkHist',[]);dh();$('#pkOut').textContent='?'};
 const dr=()=>$('#tmOut').textContent=String(Math.floor(tm/60)).padStart(2,'0')+':'+String(tm%60).padStart(2,'0');$$('[data-tm]').forEach(b=>b.onclick=()=>{tm=+b.dataset.tm*60;dr()});
 $('#tmGo').onclick=()=>{clearInterval(iv);iv=setInterval(()=>{if(tm>0){tm--;dr();if(tm===0){toast('⏰ 시간 종료!');clearInterval(iv)}}},1000)};$('#tmStop').onclick=()=>clearInterval(iv)}

function tPreview(el){if(!requireTeacher())return;el.innerHTML=`<div class="card"><h3>🎒 학생 화면 미리보기</h3><p style="font-size:14px;color:var(--muted)">학생 모드로 전환해 학생이 보는 그대로 확인합니다. 활동은 "선생님(미리보기)" 이름으로 기록되니 통계에서 제외하고 보세요.</p><div class="row"><select id="pvG">${GRADES.map(g=>`<option value="${g[0]}">${g[1]}</option>`).join('')}</select><button class="pri" id="pv">학생 모드로 보기</button></div></div>`;
 $('#pv').onclick=()=>{S={role:'student',student:{name:'선생님(미리보기)',no:0},grade:$('#pvG').value,tab:'home',fromTeacher:true};save();render()}}

function tData(el){if(!requireTeacher())return;const L=store.get('log',[]);
 el.innerHTML=`<div class="grid2"><div class="card"><h3>📨 학생 활동 코드 가져오기</h3><p style="font-size:13px;color:var(--muted)">학생이 자기 기기에서 복사한 "KR1:…" 코드를 붙여 넣으면 통계·제출물에 합쳐집니다. 여러 개를 줄바꿈으로 한꺼번에 넣어도 돼요.</p><textarea id="imp" placeholder="KR1:..." style="min-height:120px"></textarea><button class="pri" id="impGo" style="margin-top:8px">가져오기</button><div id="impRes" style="font-size:13px;margin-top:6px"></div></div>
 <div class="card"><h3>💾 백업 · 복원 · 초기화</h3><p style="font-size:13px;color:var(--muted)">모든 기록은 이 브라우저에 저장됩니다. 다른 컴퓨터로 옮기거나 학기 말에 보관하려면 백업하세요.</p><div class="row"><button class="sm" id="bk">전체 백업 복사</button><button class="sm" id="rs">백업 붙여넣기 복원</button><button class="sm" id="csv">활동 로그 CSV 복사</button></div><div class="row" style="margin-top:10px"><button class="sm" id="clearLog" style="color:var(--bad)">활동 기록만 지우기</button><button class="sm" id="clearAll" style="color:var(--bad)">전체 초기화</button></div><div id="confirm" style="margin-top:8px"></div>
 <div class="eyebrow" style="margin-top:14px">🔐 비밀번호 안내</div><p style="font-size:13px;color:var(--muted)">비밀번호는 암호화된 지문(해시)만 저장되어 원문은 사이트 코드에 없습니다. 바꾸려면 새 비밀번호의 SHA-256 값을 코드 상단 TEACHER_PW_HASH에 넣으면 됩니다.</p></div></div>`;
 $('#impGo').onclick=()=>{const codes=$('#imp').value.split(/\s+/).filter(c=>c.startsWith('KR1:'));let n=0,subsN=0;const log=store.get('log',[]),subs=store.get('subs',[]),students=store.get('students',{});const seen=new Set(log.map(l=>l.t+'|'+l.n+'|'+l.s));codes.forEach(c=>{try{const d=JSON.parse(decodeURIComponent(escape(atob(c.slice(4)))));d.log.forEach(l=>{const k=l.t+'|'+l.n+'|'+l.s;if(!seen.has(k)){log.push(l);seen.add(k);n++}});const ss=new Set(subs.map(s=>s.t+'|'+s.n));d.subs.forEach(s=>{if(!ss.has(s.t+'|'+s.n)){subs.push(s);subsN++}});const k=d.st.no+'|'+d.st.name;students[k]=students[k]||{name:d.st.name,no:d.st.no,g:d.g,first:Date.now()};students[k].last=Date.now()}catch(e){}});log.sort((a,b)=>a.t-b.t);store.set('log',log.slice(-2000));store.set('subs',subs.slice(-500));store.set('students',students);$('#impRes').innerHTML=`<span class="pill good">활동 ${n}건, 제출물 ${subsN}건 가져옴</span>`};
 const all=()=>{const o={};try{Object.keys(localStorage).filter(k=>k.startsWith('kr.')&&k!=='kr.session').forEach(k=>o[k]=localStorage.getItem(k))}catch(e){}return JSON.stringify(o)};
 $('#bk').onclick=()=>navigator.clipboard.writeText(all()).then(()=>toast('백업을 복사했습니다')).catch(()=>toast('복사 차단'));
 $('#rs').onclick=()=>{const b=document.createElement('div');b.className='overlay';b.innerHTML='<div class="box"><b>백업 텍스트 붙여넣기</b><textarea id="rsT"></textarea><div class="row" style="margin-top:8px"><button class="pri" id="rsOk">복원</button><button class="sm" id="rsNo">취소</button></div></div>';document.body.appendChild(b);$('#rsNo').onclick=()=>b.remove();$('#rsOk').onclick=()=>{try{const d=JSON.parse($('#rsT').value);Object.entries(d).forEach(([k,v])=>{if(k.startsWith('kr.'))localStorage.setItem(k,v)});b.remove();toast('복원했습니다');tData(el)}catch(e){toast('형식이 올바르지 않습니다')}}};
 $('#csv').onclick=()=>navigator.clipboard.writeText('시간,학년,번호,이름,활동,내용,점수\n'+L.map(l=>[new Date(l.t).toLocaleString('ko-KR'),gname(l.g),l.n,l.s,l.type,'"'+l.detail.replace(/"/g,'""')+'"',l.score??''].join(',')).join('\n')).then(()=>toast('CSV를 복사했습니다')).catch(()=>toast('복사 차단'));
 const ask=(msg,fn)=>{$('#confirm').innerHTML=`<div class="notice">${msg} <button class="sm" id="yes" style="color:var(--bad)">네, 지웁니다</button> <button class="sm" id="no">취소</button></div>`;$('#yes').onclick=()=>{fn();$('#confirm').innerHTML='';toast('지웠습니다');tData(el)};$('#no').onclick=()=>$('#confirm').innerHTML=''};
 $('#clearLog').onclick=()=>ask('활동 기록을 모두 지울까요?',()=>store.set('log',[]));
 $('#clearAll').onclick=()=>ask('학생·제출물·공지·시험 범위까지 전부 지울까요?',()=>{try{Object.keys(localStorage).filter(k=>k.startsWith('kr.')&&k!=='kr.session').forEach(k=>localStorage.removeItem(k))}catch(e){}})}

/* ================= BOOT ================= */
(store.get('myspell',[])).forEach(q=>SPELL.push(q));
if(S.role==='student'&&S.fromTeacher){/* preview session: offer return */}
render();
if(S.role==='student'&&S.fromTeacher){const b=document.createElement('button');b.textContent='👩‍🏫 선생님 모드로 돌아가기';b.className='pri';b.style.cssText='position:fixed;right:16px;bottom:16px;z-index:20';b.onclick=()=>{S={role:'teacher',student:null,grade:'m1',tab:'dash'};save();b.remove();render()};document.body.appendChild(b)}
</script>
</body>
</html>
